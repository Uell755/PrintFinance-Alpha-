<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — PrintFinance</title>
<script src="auth.js"></script>
<script src="storage.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><span class="logo">PrintFinance</span></div>
    <div class="auth-title">Welcome back</div>
    <div class="auth-sub">Log in to your PrintFinance account</div>

    <div class="auth-error" id="loginError"></div>

    <form id="loginForm">
      <div class="auth-field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required>
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="auth-btn">Log In</button>
    </form>

    <div class="auth-switch">Don't have an account? <a href="signup.html">Sign Up</a></div>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
