<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — PrintFinance</title>
<script src="auth.js"></script>
<script src="storage.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><span class="logo">PrintFinance</span></div>
    <div class="auth-title">Create your account</div>
    <div class="auth-sub">Set up PrintFinance for your shop</div>

    <div class="auth-error" id="signupError"></div>

    <form id="signupForm">
      <div class="auth-field">
        <label>Full Name</label>
        <input type="text" id="signupName" placeholder="Juan Dela Cruz" required>
      </div>
      <div class="auth-field">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" required>
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="At least 6 characters" required>
      </div>
      <div class="auth-field">
        <label>Confirm Password</label>
        <input type="password" id="signupConfirm" placeholder="••••••••" required>
      </div>
      <button type="submit" class="auth-btn">Sign Up</button>
    </form>

    <div class="auth-switch">Already have an account? <a href="login.html">Log In</a></div>
  </div>
</div>

<script src="signup.js"></script>
</body>
</html>
